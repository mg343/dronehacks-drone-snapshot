# course_arena_2026-11-08.yaml (the course as the team taped it), corrected by what skybeta-11 met in flight.
# Two changes, both data from the team's flights (branch core/flight-iteration), no code:
#
# 1. ADDED: something the drone hits just past the tunnel's south mouth, west of the axis.
#    Two course-follower flights struck at the same spot in the drone's own estimate, 0.46-0.58 m
#    from anything the taped map draws:
#      flights/20261108-113021-light-follower, PX4 log 22: flying straight south on x = 2.1, the body
#        rate rose at (2.12, -0.60), lift dropped, impact (72 m/s^2) at (2.07, -0.77)
#      flights/20261108-082135-light-follower, bag: hovered safely at (2.27, -0.72), then drifted to
#        (2.18, -0.81) while yawing and fell from 0.79 m
#    The obstacle must be within prop reach (0.28 m) of both touches and beyond prop reach of every
#    point the two drones passed safely; that leaves x 1.91-1.98, y -0.84 to -0.74 (the team's note
#    on that flight: "hit the wall west of the south mouth"). Below: a full-height disc over that patch.
#    The positions are where the drone THOUGHT it was, so if the cause is tracker error in the tunnel
#    rather than a missing wall, the same error brings it back here and the keep-out still holds.
#    Replace it with the real wall once someone tape-measures what is there.
#
# 2. REMOVED: the rock south of the tunnel, (2.8194, -1.07). It sits about 4 in off the east net, out of
#    the rangefinder's cone over the tunnel's axis, and it is far below the flight height (team,
#    2026-11-08; Michael Bar On's follower map dropped it in db2c90c for the same reason). Its
#    rangefinder ring was the only thing closing the way from the tunnel to Gate B round the obstacle.
